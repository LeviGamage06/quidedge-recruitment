name: Verify recruitment system
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --prefix cloudflare
      - run: npm run build --prefix cloudflare
      - run: npm test --prefix cloudflare
      - run: git diff --exit-code -- backend.js index.html cloudflare/worker.js
