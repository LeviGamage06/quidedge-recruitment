name: Deploy QuidEdge Cloudflare Worker

# The initial merge attempts deployment; subsequent deployments run manually.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-cloudflare-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quidedge-recruitment-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verified code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install project dependencies
        run: npm ci --prefix cloudflare
      - name: Build Worker and frontend
        run: npm run build --prefix cloudflare
      - name: Run regression tests
        run: npm test --prefix cloudflare
      - name: Verify generated assets are up to date
        run: git diff --exit-code -- backend.js index.html cloudflare/worker.js
      - name: Check Cloudflare deploy authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository Actions secrets before deployment."
            exit 1
          fi
      - name: Deploy existing Worker (retain dashboard variables)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
      - name: Check publicly served Hiring Role frontend
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            "https://quidedge-recruitment.inquiries-quidedge-au.workers.dev/app.js" \
            | grep -Fq "Browse the saved details of every recruitment position"
          echo "Cloudflare Worker is serving the updated Hiring Role code."
