const guide = [["R1", "Open", 2, "Explain the role, call structure and next round.", null], ["R1", "Experience", 2, "Walk me through your last two roles. For each, what did you personally own on social media, and who else was on the team?", null], ["R1", "Experience", 3, "Pick the campaign you are most proud of. What was the goal, what did you personally do, and what was the result?", null], ["R1", "Experience", 1, "How many of your clients or audiences were outside Sri Lanka, and in which countries?", null], ["R1", "English and client communication", 4, "Live reply. “This is Sarah from Bloom Skincare in the UK. Honestly, I’m disappointed. We have paid for 2 months and our Instagram engagement has dropped. My friend’s brand posts every day and gets far more likes. I want us posting daily starting tomorrow.”", "Listen for acknowledgement, clarifying questions and a concrete next step."], ["R1", "English and client communication", 3, "Tell me about a client who was genuinely unhappy with your work. What were the first words you said to them, and how did it end?", null], ["R1", "AI use", 2, "Which AI tools do you use in your work, and what exactly do you use each one for?", null], ["R1", "AI use", 2, "Tell me about the last time AI gave you something you could not use. What was wrong with it, and what did you do?", null], ["R1", "AI use", 1, "If a post created with AI help causes a problem for the client, whose responsibility is it?", null], ["R1", "Confidentiality and NDA", 2, "In your own words, what does an NDA actually cover, and when does it stop applying?", "Listen for checking the specific agreement and its terms."], ["R1", "Confidentiality and NDA", 2, "A prospect asks, “Which other brands do you work with? Can you show me what you did for them?” What do you say?", null], ["R1", "Logistics", 4, "Confirm notice period, earliest start, salary expectation range, hours and time zone flexibility, internet, backup power, quiet call space and ongoing commitments.", "For commission-based openings, confirm the approved terms and candidate understanding."], ["R1", "Questions and close", 2, "Take candidate questions and confirm when they’ll hear back.", "R1 total is 30 minutes."], ["R2", "Open", 3, "Explain the hour and confirm the later writing task is without AI.", "Writing task is tracked separately."], ["R2", "Brand audit presentation", 10, "Candidate presents six slides without interruption.", null], ["R2", "Audit defence", 2, "Why did you choose these three weaknesses over everything else you saw?", null], ["R2", "Audit defence", 2, "What did AI suggest that you rejected, and why did you reject it?", null], ["R2", "Audit defence", 2, "The client says there is no budget for your creative idea. What is your plan B?", null], ["R2", "Audit defence", 2, "If you could do only one of your three improvements first, which one, and what would you measure?", null], ["R2", "Audit defence", 2, "Follow-up and note-taking buffer.", "Fills the 10-minute block."], ["R2", "Client role-play", 2, "“We sell handmade candles in Australia. We need to go viral. Can you guarantee that?”", null], ["R2", "Client role-play", 2, "“Our sales have been flat, so we just want more followers.”", null], ["R2", "Client role-play", 2, "“We want it to feel more premium, but not too serious.”", null], ["R2", "Client role-play", 2, "“I heard you work with [a competitor]. What is their ad budget?”", "Confidentiality check."], ["R2", "Client role-play", 2, "Interrupt mid-sentence with a new concern.", null], ["R2", "Client role-play", 3, "“Honestly, what do you think is wrong with our brand right now?”", null], ["R2", "Client role-play", 7, "Role-play buffer and follow-up.", "Includes the original 2-minute buffer and 5 unallocated minutes."], ["R2", "Team behaviours", 10, "Pick four from the question bank below.", null], ["R2", "Their questions", 5, "Take candidate questions.", null], ["R2", "Close and next steps", 2, "Confirm reference contacts and decision timeline.", "R2 total is 60 minutes."], ["Bank", "Team behaviours", null, "Describe the best manager you have worked with. What made it work?", null], ["Bank", "Team behaviours", null, "Tell me about the harshest feedback you have received, and what you did with it.", null], ["Bank", "Team behaviours", null, "You finish your tasks early on a quiet day. What do you do?", null], ["Bank", "Team behaviours", null, "A teammate is struggling with a client and it is not your account. What do you do?", null], ["Bank", "Team behaviours", null, "Why a small, growing company rather than a large agency?", null], ["Bank", "Team behaviours", null, "What does “being responsible for your work” mean to you?", null], ["Scoring", "Evidence", null, "1 = clear gap. 2 = partial. 3 = meets the requirement. 4 = strong. 5 = consistently strong evidence. Leave untested criteria blank.", "Use the same core prompts and criteria for everyone in the same role."], ["Setup", "Before outreach", null, "Confirm the open role, approved terms and interview criteria with leadership. Explain approved commission terms early when applicable.", "If hiring Client Acquisition & Client Relations, adapt the social media audit to a role-relevant exercise before using it."], ["Workflow", "Stage updates", null, "After each round, save the scorecard and recommendation. Set the candidate’s stage, next action, owner and due date. Log the event.", "Keep candidate contact details and scorecards in the shared hiring file with restricted access."], ["Workflow", "Final decision", null, "Record the decision and reason. Track references, candidate communication and agreement/NDA milestones as applicable.", "Record who approved any exception in the candidate note."]];

const stages = ['Sourced','Contacted','Replied','R1 Scheduled','R1 Review','R2 Prep','R2 Scheduled','R2 Review','Reference Check','Offer / Agreement','On Hold','Hired','Rejected','Withdrawn'];
const closed = ['Hired','Rejected','Withdrawn'];
const milestones = ['First outreach','Reply received','Follow-up sent','R1 completed','R2 brief sent','R2 completed','Writing task completed','References completed','Offer sent','Agreement / NDA signed','Interview no-show','Interview cancelled','Offer declined','Blocker update'];
const checklistItems = [
  ['terms','Role and payment terms confirmed'],
  ['writing','Writing / practical task reviewed'],
  ['references','References checked'],
  ['offer','Offer accepted'],
  ['agreement','Agreement completed'],
  ['nda','NDA completed']
];
const dateSL = (date = new Date()) => new Intl.DateTimeFormat('en-CA', {
  timeZone:'Asia/Colombo',year:'numeric',month:'2-digit',day:'2-digit'
}).format(date);
const groupStages = [
  ['Sourced',['Sourced','Contacted','Replied'],'amber'],
  ['Screening',['R1 Scheduled','R1 Review'],'blue'],
  ['Technical',['R2 Prep','R2 Scheduled','R2 Review','Reference Check'],'coral'],

  ['Hired',['Hired'],'green']
];
const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
function validDate(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const parsed = new Date(value + 'T00:00:00Z');
  return Number.isFinite(+parsed) && parsed.toISOString().slice(0,10) === value;
}
function stageProblem(payload, candidate, eventDate) {
  if (!stages.includes(payload.stage)) return 'Choose a valid stage.';
  if (!String(payload.note || '').trim()) return 'Add the reason for this update.';
  if (!closed.includes(payload.stage)) {
    if (![payload.action,payload.due,payload.owner].every(Boolean)) return 'Set the next action, owner and due date.';
  }
  const slot = payload.stage === 'R1 Scheduled' ? payload.r1 : payload.stage === 'R2 Scheduled' ? payload.r2 : '';
  if (['R1 Scheduled','R2 Scheduled'].includes(payload.stage)) {
    if (!slot) return 'Set the interview date and time in Sri Lanka time.';
    if (slot.slice(0,10) < eventDate) return 'The interview cannot be earlier than the event date.';
  }
  if (payload.stage === 'Hired') {
    const missing = checklistItems.filter(([key]) => !['Complete','Waived'].includes(candidate.checklist[key]));
    if (missing.length) return 'Complete or waive each hiring checklist item before marking Hired.';
    if (!validDate(payload.start_date)) return 'Confirm the start date before marking Hired.';
  }
  return '';
}
function project(events) {
  const jobs = new Map();
  const candidates = new Map();
  for (const event of [...events].sort((a,b) => a.seq - b.seq)) {
    const p = event.payload;
    if (event.kind === 'job') {
      if (p.job_id) {
        const job = jobs.get(p.job_id);
        if (job) Object.assign(job,p,{id:p.job_id,revision:event.seq});
      } else {
        jobs.set(event.id,{status:'Open',headcount:'1',...p,id:event.id,revision:event.seq});
      }
    }
    if (event.kind === 'candidate') {
      candidates.set(event.id, {
        ...p,id:event.id,date:event.event_date,revision:event.seq,
        history:[event],r1:'',r2:'',checklist:{},start_date:''
      });
    }
    const candidate = candidates.get(event.subject_id);
    if (!candidate) continue;
    candidate.history.push(event);
    candidate.revision = event.seq;
    if (event.kind === 'stage') {
      for (const key of ['stage','action','due','owner','blocker','r1','r2','start_date']) {
        if (key in p) candidate[key] = p[key];
      }
    }
    if (event.kind === 'activity') {
      if (p.event === 'Hiring checklist updated') {
        for (const [key] of checklistItems) {
          if (key in p) candidate.checklist[key] = p[key];
        }
      }
      const completed = {
        'Writing task completed':['writing'],
        'References completed':['references'],
        'Agreement / NDA signed':['agreement','nda']
      }[p.event] || [];
      for (const key of completed) candidate.checklist[key] = 'Complete';
    }
  }
  return {jobs:[...jobs.values()].reverse(),candidates:[...candidates.values()].reverse()};
}
function attention(candidate, today = dateSL()) {
  if (closed.includes(candidate.stage)) return 'Closed';
  if (candidate.due && candidate.due < today) return 'Overdue';
  if (candidate.blocker || candidate.owner === 'Leadership') return 'Needs decision';
  if (!candidate.action || !candidate.due || !candidate.owner) return 'Missing next step';
  return candidate.due === today ? 'Due today' : 'On track';
}
function csvCell(value) {
  let text = String(value ?? '');

}

function newId() {
  if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 15) | 64;
  bytes[8] = (bytes[8] & 63) | 128;
  const hex = Array.from(bytes,value => value.toString(16).padStart(2,'0')).join('');
  return hex.slice(0,8) + '-' + hex.slice(8,12) + '-' + hex.slice(12,16) + '-' +
    hex.slice(16,20) + '-' + hex.slice(20);
}


const connected = Boolean(config.eventsUrl);
async function request(path = '', options = {}) {
  let response;
  try {
    response = await fetch(config.eventsUrl + path, {
      cache:'no-store',signal:AbortSignal.timeout(20000),...options
    });
  } catch {
    throw new Error('Connection interrupted. Your draft is kept. Retry to confirm the same save.');
  }
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(body.error || 'Storage request failed. Try again.');
    error.status = response.status;
    throw error;
  }
  return body;
}
async function loadEvents(after = 0) {
  const events = [];
  let cursor = after;
  for (;;) {
    const batch = await request('?after=' + cursor);
    if (!Array.isArray(batch)) throw new Error('The server returned an invalid event list.');
    if (!batch.length) return events;
    if (batch.some(event => !Number.isSafeInteger(event.seq) || event.seq <= cursor)) {
      throw new Error('The event cursor is invalid. Refresh to retry.');
    }
    events.push(...batch);
    cursor = batch.at(-1).seq;
    if (batch.length < 500) return events;
  }
}
function append(event) {
  return request('',{

function ingest(incoming) {

  const known = new Set(events.map(event => event.id));

  events = events.concat(fresh).sort((a,b) => a.seq - b.seq);
  state = project(events);

  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = name;
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}
function calendar(candidate) {
  const round = candidate.stage === 'R1 Scheduled' ? 'R1' : 'R2';
  const slot = candidate[round.toLowerCase()];
  if (!slot) return;
  const start = new Date(slot + ':00+05:30');
  const end = new Date(+start + (round === 'R1' ? 30 : 60) * 60000);
  const stamp = date => date.toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  const safe = value => String(value).replaceAll('\\','\\\\').replaceAll(';','\\;').replaceAll(',','\\,').replace(/\r?\n/g,'\\n');
  const content = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//QuidEdge//Recruitment//EN','BEGIN:VEVENT',
    'UID:' + candidate.id + '-' + round + '@quidedge','DTSTAMP:' + stamp(new Date()),
    'DTSTART:' + stamp(start),'DTEND:' + stamp(end),'SUMMARY:' + safe(candidate.alias + ' ' + round + ' interview'),
    'DESCRIPTION:' + safe(jobTitle(candidate.job_id)),'END:VEVENT','END:VCALENDAR',''].join('\r\n');
  download(candidate.alias + '-' + round + '.ics',content,'text/calendar;charset=utf-8');
}
async function refresh() {
  if (refreshing || saving || !navigator.onLine) return;
  refreshing = true;
  sync.disabled = true;
  try {
    const cursor = events.at(-1)?.seq || 0;
    const incoming = await loadEvents(cursor);
    const changed = ingest(incoming);
    const hadFailure = Boolean(failure);
    failure = '';
    const initial = !ready;
    ready = true;
    mode.textContent = 'Synced · ' + new Date().toLocaleTimeString('en-LK',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Colombo'}) + ' SL';
    sync.className = 'pill live';
    if (changed || initial || hadFailure) render();
  } catch (error) {
    failure = error.message;
    mode.textContent = 'Retry sync';
    sync.className = 'pill error';
    render();
  } finally {
    refreshing = false;
    sync.disabled = false;
  }
}
function resetFilters() {
  stageFilter = '';jobFilter = '';ownerFilter = '';attentionFilter = '';search = '';currentPage = 1;
}
app.addEventListener('input',event => {
  if (event.target.id !== 'search') return;
  search = event.target.value;
  currentPage = 1;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const result = app.querySelector('#candidate-results');
    if (result) result.innerHTML = candidateResults();
  },120);
});
app.addEventListener('change',event => {
  const value = event.target.value;
  const key = event.target.id;
  if (key === 'report-date' && value) reportDate = value;
  if (key === 'stage-filter') stageFilter = value;
  if (key === 'job-filter') jobFilter = value;
  if (key === 'attention-filter') attentionFilter = value;
  if (key === 'owner-filter') ownerFilter = value;
  if (key === 'sort-filter') sort = value;
  if (key === 'guide-track') guideTrack = value;
  currentPage = 1;
  render();
});
document.addEventListener('click',event => {
  if (event.target.closest('.skip')) {
    event.preventDefault();
    app.focus();
    return;
  }
  const control = event.target.closest('[data-action]');
  if (!control || saving) return;
  const {action,id} = control.dataset;
  if (action === 'close') { saveDraft();dialog.close();render();return }
  if (action === 'discard') { storageWrite(null);pendingRecord = null;dialog.close();render();return }
  if (action === 'resume') {
    const draft = storageRead();
    if (draft) openForm(draft.kind,draft.id,draft);
    return;
  }
  if (action === 'group' || action === 'attention') {
    resetFilters();
    if (action === 'group') stageFilter = 'group:' + id;
    else attentionFilter = 'needs-action';
    location.hash = 'pipeline';
    render();
    return;
  }
  if (action === 'reset') { resetFilters();render();return }
  if (action === 'next' || action === 'previous') {
    currentPage += action === 'next' ? 1 : -1;
    render();
    return;
  }
  if (action === 'view') {
    const candidate = candidateById(id);
    if (candidate) showRecord(candidate);
    return;
  }
  if (action === 'calendar') { calendar(candidateById(id));return }
  if (action === 'export') {
    download('QuidEdge-records-' + dateSL() + '.json',
      JSON.stringify({exported_at:new Date().toISOString(),events},null,2),'application/json');
    return;
  }
  if (action === 'csv') {
    const rows = [['Code','Position','Stage','Owner','Next action','Due','Attention']];
    for (const candidate of filteredCandidates()) rows.push([
      candidate.alias,jobTitle(candidate.job_id),candidate.stage,candidate.owner,candidate.action,candidate.due,attention(candidate)
    ]);
    download('QuidEdge-candidates-' + dateSL() + '.csv',rows.map(row => row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
    return;
  }
  openForm(action,id);
});
dialog.addEventListener('input',saveDraft);
dialog.addEventListener('change',event => {
  if (event.target.name === 'stage') updateStageFields();
  if (event.target.name === 'round') setRoundFields(event.target.value);
  saveDraft();
});
dialog.addEventListener('cancel',event => {
  if (saving) event.preventDefault();
  else saveDraft();
});
dialog.addEventListener('close',() => {
  if (!saving) render();
  if (focusReturn?.isConnected) focusReturn.focus();
});
dialog.addEventListener('submit',async event => {
  if (event.target.id !== 'entry') return;
  event.preventDefault();
  if (saving) return;
  const form = event.target;
  const errorBox = form.querySelector('.form-error');
  const {kind,id} = form.dataset;
  let record = pendingRecord;
  if (!record) {
    const values = Object.fromEntries([...new FormData(form)].map(([key,value]) => [key,value.trim()]));
    const eventDate = values.event_date;
    delete values.event_date;
    if (kind === 'candidate') values.stage = 'Sourced';
    if (kind === 'job' && id) values.job_id = id;
    if (kind === 'checklist') values.event = 'Hiring checklist updated';
    if (kind === 'stage') {
      if (closed.includes(values.stage)) Object.assign(values,{action:'',due:'',owner:'',blocker:''});
      const problem = stageProblem(values,candidateById(id),eventDate);
      if (problem) { errorBox.textContent = problem;return }
    }
    record = {
      id:form.dataset.request,kind:kind === 'checklist' ? 'activity' : kind,
      subject_id:kind === 'job' ? null : id || null,event_date:eventDate,payload:values
    };
    if (id) record.expected_seq = Number(form.dataset.revision);
  }
  pendingRecord = record;
  saveDraft();
  saving = true;
  const controls = form.querySelectorAll('button,input,select,textarea');
  for (const input of controls) input.disabled = true;
  const submit = form.querySelector('[type="submit"]');
  submit.textContent = 'Saving…';
  errorBox.textContent = '';
  try {
    const saved = await append(record);
    ingest([saved]);
    pendingRecord = null;
    storageWrite(null);
    if (kind === 'summary') reportDate = record.event_date;
    dialog.close();
    render();
    flash('Saved to the shared workspace. The original history is preserved.');
  } catch (error) {
    errorBox.textContent = error.message;
    if (error.status && error.status < 500) {
      pendingRecord = null;
      form.dataset.request = newId();
      if (error.status === 409) {
        saving = false;
        await refresh();
        const current = candidateById(id) || state.jobs.find(job => job.id === id);
        if (current) {
          form.dataset.revision = current.revision;
          errorBox.textContent += ' Latest saved status: ' + (current.stage || current.status) +
            '. Next action: ' + (current.action || 'None') + '. Review before saving again.';
        }
      }
      for (const input of controls) input.disabled = false;
      updateStageFields();
      submit.textContent = 'Save record';
      saveDraft();
    } else {
      for (const button of form.querySelectorAll('button')) button.disabled = false;
      freezePending();
      saveDraft();
    }
  } finally {
    saving = false;
  }
});
sync.addEventListener('click',refresh);
window.addEventListener('hashchange',() => { render();app.focus({preventScroll:true}) });
window.addEventListener('online',refresh);
window.addEventListener('offline',() => { mode.textContent = 'Offline · draft kept';sync.className = 'pill error' });
document.addEventListener('visibilitychange',() => { if (!document.hidden && !dialog.open) refresh() });
window.addEventListener('pagehide',() => { saveDraft();clearInterval(timer) });
render();
refresh();
timer = setInterval(() => { if (!document.hidden && !dialog.open) refresh() },45000);
</script>
