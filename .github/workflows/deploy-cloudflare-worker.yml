name: Deploy QuidEdge Cloudflare Worker

# Deploy tested source changes and generated assets, or run manually.
on:
  push:
    branches: [main]
    paths: ['cloudflare/**', 'backend.js', 'index.html', '.github/workflows/deploy-cloudflare-worker.yml']
  workflow_dispatch:
    inputs:
      revision:
        description: 'Test and deploy this repository revision for rollback; leave blank for the current head'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quidedge-recruitment-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verified code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install project dependencies
        run: npm ci --prefix cloudflare
      - name: Audit dependencies for high-severity advisories
        run: npm audit --prefix cloudflare --audit-level=high
      - name: Build Worker and frontend
        run: npm run build --prefix cloudflare
      - name: Run regression tests
        run: npm test --prefix cloudflare
      - name: Verify generated snapshots match the tested build
        run: git diff --exit-code -- backend.js index.html cloudflare/worker.js
      - name: Check Cloudflare deploy authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository Actions secrets before deployment."
            exit 1
          fi
      - name: Deploy existing Worker (retain dashboard variables)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars
      - name: Deploy existing candidate-facing Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.careers.jsonc --keep-vars
      - name: Verify Cloudflare serves this build
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          import worker from './cloudflare/worker.js';
          import careers from './cloudflare/careers-worker.js';

          for (const asset of ['index.html', 'app.js', 'styles.css']) {
            const response = await worker.fetch(new Request('https://local.invalid/' + asset), {});
            if (!response.ok) throw new Error('Could not read built asset ' + asset);
            await writeFile(process.env.RUNNER_TEMP + '/' + asset, await response.text());
          }
          const careersHome = await careers.fetch(new Request('https://careers.invalid/'));
          await writeFile(process.env.RUNNER_TEMP + '/careers.html', await careersHome.text());
          JS
          origin="https://quidedge-recruitment.inquiries-quidedge-au.workers.dev"
          for asset in index.html app.js styles.css; do
            path="$asset"
            if [ "$asset" = index.html ]; then path=""; fi
            matched=false
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --max-time 15 --output "$RUNNER_TEMP/live-$asset" "$origin/$path" &&
                cmp --silent "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/live-$asset"; then
                matched=true
                break
              fi
              sleep 3
            done
            if [ "$matched" != true ]; then
              echo "::error::Cloudflare is serving a different $asset from the tested build."
              exit 1
            fi
          done
          careers_origin="https://quidedge-careers.inquiries-quidedge-au.workers.dev"
          matched=false
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 --output "$RUNNER_TEMP/live-careers.html" "$careers_origin/" &&
              cmp --silent "$RUNNER_TEMP/careers.html" "$RUNNER_TEMP/live-careers.html"; then
              matched=true
              break
            fi
            sleep 3
          done
          if [ "$matched" != true ]; then
            echo "::error::Cloudflare is serving a different careers page from the tested source."
            exit 1
          fi
