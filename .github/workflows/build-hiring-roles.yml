name: Build and verify hiring role fix
on:
  push:
    branches:
      - fix/show-all-hiring-position-details
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --prefix cloudflare
      - run: npm run build --prefix cloudflare
      - run: npm test --prefix cloudflare
      - name: Commit rebuilt frontend and Worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backend.js cloudflare/worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Build generated recruitment assets"
            git push
          fi
